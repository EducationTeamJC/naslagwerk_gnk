project:
  type: book
  output-dir: _book

book:
  title: "Naslagwerk Statistiek"
  subtitle: "Beschrijvende statistiek, tabellen en grafieken"
  author: "Dorieke Brink Kwakkel & Jeppe Severens"
  date: "2026–2027"
  chapters:
    - index.qmd
    - 01-leerdoelen.qmd
    - 02-inhoud.qmd
  page-navigation: true
  search: true
  sidebar:
    style: docked
    collapse-level: 1

format:
  html:
    theme:
      - cosmo
      - styles/blokboek.scss
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    fontsize: 1.05em
    link-external-newwindow: true
    code-fold: true
    code-tools: false
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
        <style>body, h1, h2, h3, .quarto-title-block .title { font-family: "Source Serif 4", Georgia, serif; }</style>
  pdf:
    documentclass: report
    papersize: a4
    geometry:
      - margin=2.5cm
    fontsize: 11pt
    linestretch: 1.15
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header: styles/blokboek-header.tex

lang: nl

execute:
  echo: false
  warning: false
  message: false
