project:
  type: book
  output-dir: _book

book:
  title: "Naslagwerk Statistiek"
  subtitle: "Beschrijvende statistiek, tabellen en grafieken"
  author: "Dorieke Brink Kwakkel & Jeppe Severens"
  date: "2026–2027"
  site-url: https://educationteamjc.github.io/naslagwerk_gnk/
  repo-url: https://github.com/EducationTeamJC/naslagwerk_gnk
  chapters:
    - index.qmd
    - 01-leerdoelen.qmd
    - 02-inhoud.qmd
  page-navigation: true
  search: true
  sidebar:
    collapse-level: 1

format:
  html:
    theme: cosmo
    css: styles/content.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    link-external-newwindow: true
    code-fold: true
    code-tools: false

lang: nl

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
